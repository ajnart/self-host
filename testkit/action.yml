name: self-host integration testkit
description: Install the consumer SDK's matching helper and clean up job-local fixtures
inputs:
  working-directory:
    description: Consumer directory containing the installed @ajnart/self-host-testkit package
    default: ${{ github.workspace }}
  source:
    description: Build the helper and use the SDK from this Action checkout instead of a release
    default: "false"
  apps:
    description: Comma-separated App IDs to start before run (or use config)
  config:
    description: JSON runner config relative to working-directory (or use apps)
  run:
    description: Existing test command to execute with the fixture environment
  concurrency:
    description: Simultaneous startups (defaults to all declared Apps, maximum eight)
  timeout-ms:
    description: Startup and test command budget, excluding cleanup (default 720000)
  report-directory:
    description: Sanitized report location, relative to working-directory
    default: self-host-testkit-report
outputs:
  binary-path:
    description: Absolute path to the matching self-host-testkit helper
  sdk-path:
    description: Absolute path to the matching Node SDK directory
  manifest-path:
    description: Private job-local recovery manifest used by automatic post cleanup
  report-directory:
    description: Directory containing report.json and report.md when run is set
runs:
  using: node24
  main: node/action.mjs
  post: node/action.mjs
  post-if: always()

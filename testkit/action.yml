name: self-host integration testkit
description: Install the consumer SDK's matching helper and clean up job-local fixtures
inputs:
  working-directory:
    description: Consumer directory containing the installed @ajnart/self-host-testkit package
    default: ${{ github.workspace }}
  source:
    description: Build the helper and use the SDK from this Action checkout instead of a release
    default: "false"
outputs:
  binary-path:
    description: Absolute path to the matching self-host-testkit helper
  sdk-path:
    description: Absolute path to the matching Node SDK directory
  manifest-path:
    description: Private job-local recovery manifest used by automatic post cleanup
runs:
  using: node24
  main: node/action.mjs
  post: node/action.mjs
  post-if: always()
